<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="6" filter="url(#shadowFilter)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Outer Dial Track -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad512)" stroke-width="14" stroke-dasharray="1068" stroke-dashoffset="267" stroke-linecap="round" />

  <!-- Secondary Inner Track -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Cardinal Hour Markers -->
  <line x1="256" y1="102" x2="256" y2="126" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="410" y1="256" x2="386" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="410" x2="256" y2="386" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="102" y1="256" x2="126" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <!-- Sub Markers (30 deg) -->
  <line x1="333" y1="123" x2="321" y2="144" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="389" y1="179" x2="368" y2="191" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="389" y1="333" x2="368" y2="321" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="333" y1="389" x2="321" y2="368" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="179" y1="389" x2="191" y2="368" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="123" y1="333" x2="144" y2="321" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="123" y1="179" x2="144" y2="191" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="179" y1="123" x2="191" y2="144" stroke="#475569" stroke-width="5" stroke-linecap="round" />

  <!-- Hands -->
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="175" y2="195" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />
  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="345" y2="170" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" />
  <!-- Millisecond Sweeper Hand -->
  <line x1="256" y1="256" x2="256" y2="360" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="256" x2="256" y2="210" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="22" fill="#10b981" stroke="#080c14" stroke-width="8" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- Badge Text (ms · TZ) -->
  <text x="256" y="210" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="4">MILLIS · TZ</text>
</svg>
